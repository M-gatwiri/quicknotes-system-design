<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes | Your Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <p class="eyebrow">QUICKNOTES</p>
            <h1>Your thoughts, organized.</h1>
            <p class="intro">Create notes, keep track of ideas, and explore how a web app communicates with an API.</p>
        </div>
    </header>

<main class="container">
    <section class="panel" aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>

        <form id="note-form">
            <label for="title-input">Title</label>
            <input
                type="text"
                id="title-input"
                name="title"
                maxlength="100"
                required
                placeholder="Enter your note title"
            >

            <label for="body-input">Note details</label>
            <textarea
                id="body-input"
                name="body"
                rows="4"
                placeholder="What would you like to remember?"
            ></textarea>

            <button id="submit-btn" type="submit">Create note</button>
        </form>
    </section>

    <section class="panel" aria-labelledby="notes-heading">
        <div class="section-heading">
            <div>
                <p class="eyebrow">YOUR WORKSPACE</p>
                <h2 id="notes-heading">Your notes</h2>
            </div>

            <button id="load-btn" type="button">Load notes</button>
        </div>

        <p id="status" role="status" aria-live="polite">
            Click "Load notes" to retrieve notes from the server.
        </p>

        <ul id="notes-list"></ul>
    </section>
</main>

<footer class="container footer">
    <p>QuickNotes · A REST API learning project</p>
</footer>


</body>
</html>
